name: ertaki_mobile
description: ارتق — تطبيق متابعة حفظ القرآن
publish_to: "none"
version: 1.0.13+14

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  url_launcher: ^6.3.1
  google_fonts: ^6.3.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/quran/qalun_surahs.json
    - assets/quran/DATASET.md
    - assets/branding/app_logo.png
    - assets/branding/GroupLogo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_logo.png
  adaptive_icon_background: "#0F3D2E"
  adaptive_icon_foreground: assets/branding/app_logo.png
  remove_alpha_ios: true

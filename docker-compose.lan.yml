# Home Wi‑Fi / Docker Desktop pilot overlay.
#
# FORBIDDEN on a public VPS — disables automatic HTTPS and opens catch‑all HTTP.
# VPS command is only:  docker compose up -d --build
#
# Home usage (from project root):
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build
#
# - Caddyfile.lan listens on :80 for ANY Host (localhost, 127.0.0.1, LAN IP)
# - Publishes 80 and fallback 8080 (Windows often blocks or reserves port 80)
# - auto_https off so private IPs never fight Let's Encrypt

services:
  caddy:
    ports:
      # Explicit 0.0.0.0 so LAN devices (phone / other PC) can reach the host, not only localhost.
      - "0.0.0.0:80:80"
      - "0.0.0.0:8080:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./deploy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-practice@example.com}
